# Without this the default ruleset is replaced rather than extended, and nothing is detected.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "the deliberate fixture token in the test suite"
condition = "AND"
paths = ['''_test\.go$''']
regexes = ['''TestToken0123456789ABCDEF==''']

[[rules.allowlists]]
description = "admin:your-password, the README quick-start example"
condition = "AND"
paths = ['''^README\.md$''']
regexes = ['''^YWRtaW46eW91ci1wYXNzd29yZA==$''']
